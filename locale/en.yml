  lib:
    chapter_number: "Chapter {number}"
    discussion_body: "{chapter} is out."
    format:
      manga: Manga
      manhwa: Manhwa
      manhua: Manhua
      webtoon: Webtoon
      comic: Comic
      other: Other
    kiosk:
      series: Comic series
      chapter: Comic chapter
    gdpr:
      export: "Your comics library, reading places, ratings and downloads."
      delete: "Your comics library, reading places, ratings and downloads are deleted. Series you uploaded stay."
    widget:
      new: New chapters
      continue: Continue reading
      trending: Trending
      spotlight: Series spotlight
      stats: Library stats
      count: How many
      format: Format
      format_any: Any format
      layout: Layout
      layout_list: List
      layout_covers: Covers
      period: Period
      period_week: This week
      period_all: All time

  email:
    new_chapters:
      subject: "{count, plural, one {New chapter of {series}: {number}} other {# new chapters of {series}}}"
      html:
        body: "{count, plural, one {Chapter {number} of {series} is out.} other {# new chapters of {series} are out, starting with chapter {number}.}}\n\n[Start reading]({url})"
      plain:
        body: "{count, plural, one {Chapter {number} of {series} is out.} other {# new chapters of {series} are out, starting with chapter {number}.}}\n\nStart reading: {url}"
    takedown:
      disabled_subject: "{target} was taken down after a copyright claim"
      restored_subject: "{target} is back up"
      disabled_html: "**{target}** was taken down after a copyright claim. You'll see the claim, and can file a counter-notice if you believe it's a mistake, here:\n\n[Respond to the claim]({url})"
      disabled_plain: "{target} was taken down after a copyright claim. You can see the claim, and file a counter-notice if you believe it's a mistake, here: {url}"
      restored_html: "**{target}** has been restored and is visible again."
      restored_plain: "{target} has been restored and is visible again."
    claimant:
      subject: "Your copyright claim on {forum} (#{id})"
      disabled: "Hello {name},\n\nThank you for your claim. {target} has been taken down on {forum}.\n\nIf the uploader files a counter-notice, we'll send it to you."
      reject: "Hello {name},\n\nWe've looked at your claim about {target} on {forum} and haven't taken it down.\n\nReason: {reason}"
      info: "Hello {name},\n\nWe need more information about your claim on {target} before we can act on it:\n\n{reason}\n\nReply with the details and we'll look again."
      counter: "Hello {name},\n\nThe uploader of {target} on {forum} has filed a counter-notice. Unless you tell us within 10 business days that you've filed a court action, the moderators may restore it.\n\n{counter}"
